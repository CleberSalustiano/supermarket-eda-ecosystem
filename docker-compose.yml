services:
  checkout-postgres:
    image: postgres:16-alpine
    container_name: checkout-postgres
    environment:
      POSTGRES_DB: checkout_service
      POSTGRES_USER: checkout_user
      POSTGRES_PASSWORD: checkout_password
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkout_user -d checkout_service']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - checkout-postgres-data:/var/lib/postgresql/data

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory_service
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory_user -d inventory_service']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data

  management-postgres:
    image: postgres:16-alpine
    container_name: management-postgres
    environment:
      POSTGRES_DB: management_service
      POSTGRES_USER: management_user
      POSTGRES_PASSWORD: management_password
    ports:
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U management_user -d management_service']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - management-postgres-data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: supermarket-kafka
    hostname: kafka
    ports:
      - '19092:19092'
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: supermarket-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: 'false'

volumes:
  checkout-postgres-data:
  inventory-postgres-data:
  management-postgres-data:
